<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="base-path" content="/cesu" />
  <title>Calculateur CESU</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <h2>Historique</h2>
      <div id="history-list"><p class="empty">Aucun calcul enregistré.</p></div>
    </aside>

    <main id="content">
      <h1>Calculateur de Salaire CESU</h1>

      <form id="calc-form">
        <div id="readonly-banner" class="hidden readonly-banner">
          Consultation seule — ce mois est clôturé et ne peut plus être modifié.
        </div>
        <div class="form-grid">
          <label>
            Mois
            <select id="month" name="month" required></select>
          </label>
          <label>
            Année
            <input id="year" name="year" type="number" min="1900" max="2100" required />
          </label>
          <label>
            Salaire horaire net (€)
            <input id="salaryNett" name="salaryNett" type="number" step="0.01" min="0.01" required />
          </label>
          <label>
            Jours d'absence
            <input id="nbAbsentDays" name="nbAbsentDays" type="number" min="0" value="0" />
          </label>
          <label>
            Indemnité de transport (€)
            <input id="transport" name="transport" type="number" step="0.01" min="0" value="60" />
          </label>
        </div>
        <button type="submit" id="submit-btn">Calculer</button>
      </form>

      <div id="error-box" class="hidden"></div>
      <div id="result-box" class="hidden"></div>
    </main>
  </div>

  <!-- Toast notification -->
  <div id="toast" class="hidden" role="status" aria-live="polite">Enregistré ✓</div>

  <!-- Confirm dialog -->
  <div id="confirm-overlay" class="hidden" role="dialog" aria-modal="true" aria-labelledby="confirm-msg">
    <div id="confirm-box">
      <p id="confirm-msg">Supprimer ce calcul ?</p>
      <div class="confirm-actions">
        <button id="confirm-cancel">Annuler</button>
        <button id="confirm-ok" class="btn-danger">Supprimer</button>
      </div>
    </div>
  </div>

  <script src="constants.js"></script>
  <script src="app.js"></script>
</body>
</html>
